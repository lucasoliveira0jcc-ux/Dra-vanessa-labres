    // document mints the blobs for its OWN frames, obtaining page text

      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

      ';</' + 'script>';

    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than

    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

{ mapsHref }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;min-height:44px;font-weight:500;text-decoration:underline;text-decoration-color:#C9A96E;text-decoration-thickness:2px;text-underline-offset:6px;\">Abrir no Google Maps<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:14px\">\n            <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"flex:none;margin-top:3px;fill:none;stroke:#2B2118;stroke-width:1.5;stroke-linejoin:round\"><path d=\"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z\"><\u002Fpath><\u002Fsvg>\n            <div>\n              <h3 style=\"margin:0;font-size:17px;font-weight:500\">Telefone e WhatsApp<\u002Fh3>\n              <a href=\"tel:+5588999028938\" style=\"display:inline-flex;align-items:center;min-height:44px\">(88) 99902-8938<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:14px\">\n            <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"flex:none;margin-top:3px;fill:none;stroke:#2B2118;stroke-width:1.5;stroke-linecap:round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg>\n            <div style=\"flex:1;min-width:0\">\n              <h3 style=\"margin:0;font-size:17px;font-weight:500\">Horário<\u002Fh3>\n              <dl style=\"margin:8px 0 0;display:flex;flex-direction:column;gap:4px\">\n                <sc-for list=\"{{ hours }}\" as=\"h\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;padding:10px 12px;margin:0 -12px;border-radius:4px;background:{{ h.bg }}\">\n                    <dt style=\"font-weight:{{ h.weight }}\">{{ h.day }}<\u002Fdt>\n                    <dd style=\"margin:0\">{{ h.time }}<\u002Fdd>\n                  < s\" style=\"flex:1 1 min(100%,260px);min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;align-content:start\">\n        <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"5\">\n          <a href=\"{{ item.href }}\" style=\"display:flex;align-items:center;min-height:44px;text-decoration:none\">{{ item.longLabel }}<\u002Fa>\n        <\u002Fsc-for>\n        <a href=\"{{ waHref }}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;min-height:44px;text-decoration:none\">WhatsApp<\u002Fa>\n        <a href=\"{{ mapsHref }}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;min-height:44px;text-decoration:none\">Google Maps<\u002Fa>\n        <a href=\"https://www.instagram.com/dra.vanessalabres/\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;min-height:44px;text-decoration:none\">Instagram<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n    <p style=\"margin:clamp(48px,6vw,80px) 0 0;font-size:15px;color:#DCCFB9\">© {{ year }} Dra. Vanessa Labres · Harmonização Facial<\u002Fp>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;heroPhotoSide&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;direita&quot;,&quot;esquerda&quot;],&quot;default&quot;:&quot;direita&quot;,&quot;tsType&quot;:&quot;'direita'|'esquerda'&quot;,&quot;section&quot;:&quot;Capa&quot;},&quot;showTodayStatus&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Capa&quot;}}\">\nclass Component extends DCLogic {\n  mainRef = React.createRef();\n  menuBtnRef = React.createRef();\n  drawerCloseRef = React.createRef();\n  panelRef = React.createRef();\n  scrimRef = React.createRef();\n  state = {\n    route: this.parseRoute(),\n    w: typeof window !== 'undefined' ? window.innerWidth : 1280,\n    drawer: false,\n    interest: 'Avaliação inicial',\n    period: 'Sem preferência',\n    name: ''\n  };\n\n  parseRoute() {\n    const h = (window.location.hash || '').replace(/^#\\/?/, '');\n    return ['procedimentos', 'sobre', 'avaliacoes', 'agendamento'].includes(h) ? h : 'inicio';\n  }\n\n  componentDidMount() {\n    this.onHash = () => {\n      const route = this.parseRoute();\n      if (route === this.state.route) { this.setState({ drawer: false }); return; }\n      this.setState({ route, drawer: false }, () => {\n        window.scrollTo(0, 0);\n        this.mainRef.current && this.mainRef.current.focus({ preventScroll: true });\n      });\n    };\n    this.onResize = () => this.setState({ w: window.innerWidth });\n    window.addEventListener('hashchange', this.onHash);\n    window.addEventListener('resize', this.onResize);\n    setTimeout(() => this.setupReveal(), 60);\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('hashchange', this.onHash);\n    window.removeEventListener('resize', this.onResize);\n    this.io && this.io.disconnect();\n    document.body.style.overflow = '';\n  }\n\n  componentDidUpdate(_, prev) {\n    if (prev.route !== this.state.route) setTimeout(() => this.setupReveal(), 60);\n    if (!prev.drawer && this.state.drawer) {\n      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n      const p = this.panelRef.current, s = this.scrimRef.current;\n      p && p.animate(reduce ? [{ opacity: 0 }, { opacity: 1 }] : [{ transform: 'translateX(100%)' }, { transform: 'translateX(0)' }], { duration: reduce ? 150 : 320, easing: 'cubic-bezier(0.32,0.72,0,1)' });\n      s && s.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: 'ease-out' });\n    }\n    if (prev.drawer !== this.state.drawer) {\n      document.body.style.overflow = this.state.drawer ? 'hidden' : '';\n      setTimeout(() => {\n        const t = this.state.drawer ? this.drawerCloseRef.current : this.menuBtnRef.current;\n        t && t.focus();\n      }, 30);\n    }\n    if (this.state.w >= 900 && this.state.drawer) this.setState({ drawer: false });\n  }\n\n  closeDrawerAnimated() {\n    const p = this.panelRef.current, s = this.scrimRef.current;\n    if (!p || this.closing) { if (!p) this.setState({ drawer: false }); return; }\n    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    this.closing = true;\n    const a = p.animate(reduce ? [{ opacity: 1 }, { opacity: 0 }] : [{ transform: 'translateX(0)' }, { transform: 'translateX(100%)' }], { duration: reduce ? 120 : 240, easing: 'cubic-bezier(0.32,0.72,0,1)', fill: 'forwards' });\n    s && s.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, easing: 'ease-out', fill: 'forwards' });\n    const done = () => { this.closing = false; this.setState({ drawer: false }); };\n    a.onfinish = done; a.oncancel = done;\n  }\n\n  setupReveal() {\n    if (!('IntersectionObserver' in window)) return;\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    if (!this.io) {\n      this.io = new IntersectionObserver((entries) => {\n        entries.forEach((e) => {\n          if (!e.isIntersecting) return;\n          const el = e.target;\n          this.io.unobserve(el);\n          const d = (Number(el.getAttribute('data-reveal')) || 0) * 70;\n          el.animate(\n            [{ opacity: 0, transform: 'translateY(20px)' }, { opacity: 1, transform: 'translateY(0)' }],\n            { duration: 640, delay: d, easing: 'cubic-bezier(0.23,1,0.32,1)', fill: 'backwards' }\n          );\n        });\n      }, { rootMargin: '0px 0px -8% 0px' });\n    }\n    document.querySelectorAll('[data-kenburns]:not([data-kb])').forEach((el) => {\n      el.setAttribute('data-kb', '1');\n      const img = el.firstElementChild;\n      img && img.animate([{ transform: 'scale(1.06)' }, { transform: 'scale(1)' }], { duration: 1600, easing: 'cubic-bezier(0.23,1,0.32,1)' });\n    });\n    document.querySelectorAll('[data-reveal]:not([data-rv])').forEach((el) => {\n      el.setAttribute('data-rv', '1');\n      this.io.observe(el);\n    });\n  }\n\n  buildMessage() {\n    const { interest, period, name } = this.state;\n    let m = 'Olá, Dra. Vanessa.';\n    if (name.trim()) m += ` Meu nome é ${name.trim()}.`;\n    m += interest === 'Avaliação inicial' || interest === 'Ainda não sei'\n      ? ' Gostaria de agendar uma avaliação.'\n      : ` Gostaria de agendar uma avaliação sobre ${interest.toLowerCase()}.`;\n    if (period === 'Sábado') m += ' Tenho preferência pelo sábado.';\n    else if (period !== 'Sem preferência') m += ` Tenho preferência pelo período da ${period.toLowerCase()}.`;\n    return m;\n  }\n\n  renderVals() {\n    const { route, w, drawer, interest, period, name } = this.state;\n    const isMobile = w < 900;\n    const phone = '5588999028938';\n    const waMessage = this.buildMessage();\n    const waHref = `https://wa.me/${phone}?text=${encodeURIComponent(waMessage)}`;\n    const addr = 'R. Catulo da Paixão Cearense, 135, Triângulo, Juazeiro do Norte - CE, 63041-162';\n    const mapsHref = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}`;\n    const googleReviewsHref = `https://www.google.com/search?q=${encodeURIComponent('Dra. Vanessa Labres Harmonização Facial Juazeiro do Norte')}`;\n\n    const nav = [\n      { r: 'inicio', label: 'Início', longLabel: 'Início', href: '#/' },\n      { r: 'procedimentos', label: 'Procedimentos', longLabel: 'Procedimentos', href: '#/procedimentos' },\n      { r: 'sobre', label: 'Sobre', longLabel: 'Sobre a Dra. Vanessa', href: '#/sobre' },\n      { r: 'avaliacoes', label: 'Avaliações', longLabel: 'Avaliações', href: '#/avaliacoes' },\n      { r: 'agendamento', label: 'Contato', longLabel: 'Agendamento e contato', href: '#/agendamento' }\n    ];\n    const navItems = nav.map((n) => ({\n      ...n,\n      current: n.r === route ? 'page' : undefined,\n      color: n.r === route ? '#C9A96E' : '#F3EAD9'\n    }));\n\n    const go =
