        e.target.tagName, String(e.target.src || e.target.href || ''));

    // navigation stays same-origin with its initiator and a deduped page

    // opaque origins (where a blob minted by one document cannot be

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's

    // "page text" from it, minting attacker HTML as an artifact-origin

    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // deny-by-default: one request form, one reply form, no error

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;

      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

              totalLen += value.length;

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

eal=\"3\" style=\"margin:clamp(48px,6vw,80px) 0 0;padding:0 0 0 28px;position:relative;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(26px,2.6vw,36px);line-height:1.22;letter-spacing:-0.01em;max-width:22em;text-wrap:pretty\">\n          <span aria-hidden=\"true\" style=\"position:absolute;left:0;top:6px;bottom:6px;width:3px;background:#C9A96E;border-radius:2px\"><\u002Fspan>\n          “Acredito em um cuidado que respeita o seu rosto e a sua história. Cada indicação nasce de uma conversa, nunca de um padrão.”\n        <\u002Fblockquote>\n        <a href=\"#/sobre\" data-reveal=\"4\" style=\"display:inline-flex;align-items:center;min-height:44px;margin-top:32px;font-weight:500;color:#2B2118;text-decoration:underline;text-decoration-color:#C9A96E;text-decoration-thickness:2px;text-underline-offset:6px;\">Conheça a trajetória da Dra. Vanessa<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section aria-labelledby=\"proc-titulo\" data-screen-label=\"Início · Procedimentos\" style=\"background:#362A20\">\n    <div style=\"max-width:1440px;margin:0 auto;padding:clamp(88px,12vw,176px) clamp(16px,4vw,32px)\">\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px 48px\">\n        <h2 id=\"proc-titulo\" data-reveal=\"0\" style=\"font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(40px,5vw,72px);line-height:1;letter-spacing:-0.02em;margin:0;max-width:12em\">Procedimentos em destaque<\u002Fh2>\n        <p data-reveal=\"1\" style=\"margin:0;max-width:30em;color:#DCCFB9\">Cada indicação parte de uma avaliação individual, com tempo para tirar dúvidas.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-top:clamp(48px,6vw,80px)\">\n        <sc-for list=\"{{ procs }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <article data-reveal=\"{{ p.reveal }}\" style=\"background:#41332A;border-radius:6px;padding:clamp(28px,3vw,40px);display:flex;flex-direction:column;gap:16px\">\n            <h3 style=\"font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(30px,2.6vw,38px);line-height:1.05;letter-spacing:-0.01em;margin:0;min-height:2.1em\">{{ p.name }}<\u002Fh3>\n            <p style=\"margin:0\">{{ p.short }}<\u002Fp>\n            <div style=\"margin-top:auto;padding-top:16px\">\n              <h4 style=\"margin:0;font-size:17px;font-weight:500;color:#C9A96E\">Indicado para<\u002Fh4>\n              <p style=\"margin:6px 0 0\">{{ p.forWhom }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <a href=\"#/procedimentos\" style=\"display:inline-flex;align-items:center;min-height:44px;margin-top:32px;font-weight:500;text-decoration:underline;text-decoration-color:#C9A96E;text-decoration-thickness:2px;text-underline-offset:6px;\">Ver detalhes dos procedimentos<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section aria-labelledby=\"aval-titulo\" data-tone=\"light\" data-screen-label=\"Início · Primeira avaliação\" style=\"background:#F3EAD9;color:#2B2118\">\n    <div style=\"max-width:1440px;margin:0 auto;padding:clamp(88px,12vw,176px) clamp(16px,4vw,32px);display:flex;flex-wrap:wrap;gap:clamp(48px,6vw,96px)\">\n      <div style=\"flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:40px\">\n        <h2 id=\"aval-titulo\" data-reveal=\"0\" style=\"font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(40px,5vw,72px);line-height:1;letter-spacing:-0.02em;margin:0;max-width:10em\">Como é a primeira avaliação<\u002Fh2>\n        <figure data-reveal=\"1\" style=\"margin:0\">\n          <div style=\"position:relative;width:100%;aspect-ratio:3/2;background:#E6D9C2;border-radius:6px;overflow:hidden\">\n            <image-slot id=\"ambiente-sala\" src=\"{{ imgSala }}\" shape=\"rounded\" radius=\"6\" placeholder=\"Imagem de ambiente: sala de atendimento, luz suave\" alt=\"Imagem ilustrativa de uma sala de atendimento\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <figcaption style=\"font-size:15px;color:#5A4A3B;margin-top:12px\">Imagem ilustrativa<\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fdiv>\n      <div style=\"flex:1.2 1 440px;min-width:0;display:flex;flex-direction:column;gap:clamp(40px,5vw,64px);padding-top:clamp(0px,1vw,12px)\">\n        <div data-reveal=\"1\">\n          <h3 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(28px,2.4vw,34px);line-height:1.1;margin:0\">O que levar<\u002Fh3>\n          <ul style=\"margin:16px 0 0;padding:0 0 0 20px;display:flex;flex-direction:column;gap:8px\">\n            <li>Documento com foto.<\u002Fli>\n            <li>Lista de medicamentos em uso e alergias conhecidas.<\u002Fli>\n            <li>Informações sobre procedimentos estéticos anteriores, se houver.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div data-reveal=\"2\">\n          <h3 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(28px,2.4vw,34px);line-height:1.1;margin:0\">A conversa inicial<\u002Fh3>\n          <p style=\"margin:16px 0 0;max-width:36em\">A Dra. Vanessa ouve o que você deseja, avalia o seu rosto e explica as opções possíveis, com indicações e cuidados. Nenhum procedimento é decidido sem essa conversa.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"3\">\n          <h3 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(28px,2.4vw,34px);line-height:1.1;margin:0\">Como agendar<\u002Fh3>\n          <p style=\"margin:16px 0 0;max-width:36em\">Envie uma mensagem pelo WhatsApp (88) 99902-8938 e escolha o melhor horário. Atendimento de segunda a sexta, das 8h às 18h, e aos sábados, das 9h às 14h.<\u002Fp>\n          <a href=\"#/agendamento\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 26px;margin-top:24px;background:#2B2118;color:#F3EAD9;text-decoration:none;font-weight:500;border-radius:4px;transition:background-color .2s ease,transform .16s cubic-bezier(0.23,1,0.32,1)\" style-hover=\"background:#41332A;color:#F3EAD9\" style-active=\"transform:scale(0.98)\">Agendar avaliação<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isInner }}\" hint-placeholder-val=\"{{ false }}\">\n  <section aria-labelledby=\"pagina-titulo\" data-screen-label=\"{{ pageLabel }}\" style=\"background:#2B2118\">\n    <div style=\"max-width:1440px;margin:0 auto;padding:clamp(56px,8vw,120px) clamp(16px,4vw,32px) clamp(56px,7vw,104px)\">\n      <h1 id=\"pagina-titulo\" data-reveal=\"0\" style=\"font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(44px,7vw,104px);line-height:0.98;letter-spacing:-0.03em;margin:0;max-width:12em;text-wrap:balance\">{{ pageTitle }}<\u002Fh1>\n      <p data-reveal=\"1\" style=\"font-size:clamp(18px,1.5vw,21px);margin:24px 0 0;max-width:36em;color:#F3EAD9;text-wrap:pretty\">{{ pageIntro }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isProcedimentos }}\" hint-placeholder-val=\"{{ false }}\">\n  <section aria-label=\"Lista de procedimentos\" data-tone=\"light\" style=\"background:#F3EAD9;color:#2B2118\">\n    <div style=\"max-width:1440px;margin:0 auto;padding:clamp(72px,10vw,144px) clamp(16px,4vw,32px)\">\n      <figure data-reveal=\"0\" style=\"margin:0 0 clamp(72px,9vw,128px)\">\n        <div style=\"position:relative;width:100%;aspect-ratio:21/9;min-height:220px;background:#E6D9C2;border-radius:6px;overflow:hidden\">\n          <image-slot id=\"ambiente-materiais\" src=\"{{ imgSala }}\" shape=\"rounded\" radius=\"6\" placeholder=\"Imagem de ambiente: materiais, bancada, luz natural\" alt=\"Imagem ilustrativa de materiais de atendimento\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <figcaption style=\"font-size:15px;color:#5A4A3B;margin-top:12px\">Imagem ilustrativa<\u002Ffigcaption>\n      <\u002Ffigure>\n      <div style=\"display:flex;flex-direction:column;gap:clamp(72px,9vw,128px)\">\n        <sc-for list=\"{{ procs }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <article style=\"display:flex;flex-wrap:wrap;gap:24px clamp(40px,6vw,96px)\">\n            <h2 data-reveal=\"0\" style=\"flex:1 1 320px;min-width:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(36px,4vw,60px);line-height:1;letter-spacing:-0.02em;margin:0;max-width:9em\">{{ p.name }}<\u002Fh2>\n            <div data-reveal=\"1\" style=\"flex:1.5 1 440px;min-width:0;display:flex;flex-direction:column;gap:28px\">\n              <p style=\"margin:0;font-size:clamp(19px,1.6vw,22px);line-height:1.45;max-width:32em\">{{ p.short }}<\u002Fp>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:28px 40px\">\n                <div>\n                  <h3 style=\"margin:0;font-size:17px;font-weight:500\">Como funciona<\u002Fh3>\n                  <p style=\"margin:6px 0 0\">{{ p.how }}<\u002Fp>\n                <\u002Fdiv>\n                <div>\n                  <h3 style=\"margin:0;font-size:17px;font-weight:500\">Indicado para<\u002Fh3>\n                  <p style=\"margin:6px 0 0\">{{ p.forWhom }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"margin:0;color:#5A4A3B\">Sessão de cerca de 40 minutos, com retorno combinado na avaliação (exemplo).<\u002Fp>\n              <a href=\"#/agendamento\" sc-camel-on-click=\"{{ p.pick }}\" style=\"align-self:flex-start;display:inline-flex;align-items:center;min-height:44px;font-weight:500;color:#2B2118;text-decoration:underline;text-decoration-color:#C9A96E;text-decoration-thickness:2px;text-underline-offset:6px;\">Agendar avaliação para {{ p.lower }}<\u002Fa>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div data-reveal=\"0\" style=\"margin-top:clamp(72px,9vw,128px);background:#EADDC6;border-radius:6px;padding:clamp(28px,4vw,48px);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:24px\">\n        <p style=\"margin:0;max-width:34em;font-size:clamp(18px,1.5vw,21px)\">Outros procedimentos podem ser indicados na avaliação, conforme o que faz sentido para o seu rosto.<\u002Fp>\n        <a href=\"#/agendamento\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 26px;background:#2B2118;color:#F3EAD9;text-decoration:none;font-weight:500;border-radius:4px;transition:background-color .2s ease,transform .16s cubic-bezier(0.23,1,0.32,1)\" style-hover=\"background:#41332A;color:#F3EAD9\" style-active=\"transform:scale(0.98)\">Agendar avaliação<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isSobre }}\" hint-placeholder-val=\"{{ false }}\">\n  <section aria-label=\"Trajetória\" data-tone=\"light\" style=\"background:#F3EAD9;color:#2B2118\">\n    <div style=\"max-width:1440px;margin:0 auto;padding:clamp(72px,10vw,144px) clamp(16px,4vw,32px);display:flex;flex-wrap:wrap;gap:clamp(48px,6vw,96px)\">\n      <div data-reveal=\"0\" style=\"flex:1 1 340px;max-width:540px;width:100%\">\n        <div style=\"position:relative;width:100%;aspect-ratio:4/5;background:#E6D9C2;border-radius:6px;overflow:hidden\">\n          <image-slot id=\"foto-doutora-sobre\" src=\"{{ imgSala }}\" shape=\"rounded\" radius=\"6\" placeholder=\"Foto original da Dra. Vanessa (retrato ou em atendimento)\" alt=\"Imagem ilustrativa de uma sala de atendimento em tons de madeira\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <p style=\"margin:12px 0 0;font-size:15px;color:#5A4A3B\">Imagem ilustrativa<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1.3 1 440px;min-width:0;display:flex;flex-direction:column;gap:clamp(40px,5vw,64px)\">\n        <blockquote data-reveal=\"0\" style=\"margin:0;padding:0 0 0 2 quot;direita&quot;,&quot;tsType&quot;:&quot;'direita'|'esquerda'&quot;,&quot;section&quot;:&quot;Capa&quot;},&quot;showTodayStatus&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Capa&quot;}}\">\nclass Component extends DCLogic {\n  mainRef = React.createRef();\n  menuBtnRef = React.createRef();\n  drawerCloseRef = React.createRef();\n  panelRef = React.createRef();\n  scrimRef = React.createRef();\n  state = {\n    route: this.parseRoute(),\n    w: typeof window !== 'undefined' ? window.innerWidth : 1280,\n    drawer: false,\n    interest: 'Avaliação inicial',\n    period: 'Sem preferência',\n    name: ''\n  };\n\n  parseRoute() {\n    const h = (window.location.hash || '').replace(/^#\\/?/, '');\n    return ['procedimentos', 'sobre', 'avaliacoes', 'agendamento'].includes(h) ? h : 'inicio';\n  }\n\n  componentDidMount() {\n    this.onHash = () => {\n      const route = this.parseRoute();\n      if (route === this.state.route) { this.setState({ drawer: false }); return; }\n      this.setState({ route, drawer: false }, () => {\n        window.scrollTo(0, 0);\n        this.mainRef.current && this.mainRef.current.focus({ preventScroll: true });\n      });\n    };\n    this.onResize = () => this.setState({ w: window.innerWidth });\n    window.addEventListener('hashchange', this.onHash);\n    window.addEventListener('resize', this.onResize);\n    setTimeout(() => this.setupReveal(), 60);\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('hashchange', this.onHash);\n    window.removeEventListener('resize', this.onResize);\n    this.io && this.io.disconnect();\n    document.body.style.overflow = '';\n  }\n\n  componentDidUpdate(_, prev) {\n    if (prev.route !== this.state.route) setTimeout(() => this.setupReveal(), 60);\n    if (!prev.drawer && this.state.drawer) {\n      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n      const p = this.panelRef.current, s = this.scrimRef.current;\n      p && p.animate(reduce ? [{ opacity: 0 }, { opacity: 1 }] : [{ transform: 'translateX(100%)' }, { transform: 'translateX(0)' }], { duration: reduce ? 150 : 320, easing: 'cubic-bezier(0.32,0.72,0,1)' });\n      s && s.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: 'ease-out' });\n    }\n    if (prev.drawer !== this.state.drawer) {\n      document.body.style.overflow = this.state.drawer ? 'hidden' : '';\n      setTimeout(() => {\n        const t = this.state.drawer ? this.drawerCloseRef.current : this.menuBtnRef.current;\n        t && t.focus();\n      }, 30);\n    }\n    if (this.state.w >= 900 && this.state.drawer) this.setState({ drawer: false });\n  }\n\n  closeDrawerAnimated() {\n    const p = this.panelRef.current, s = this.scrimRef.current;\n    if (!p || this.closing) { if (!p) this.setState({ drawer: false }); return; }\n    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    this.closing = true;\n    const a = p.animate(reduce ? [{ opacity: 1 }, { opacity: 0 }] : [{ transform: 'translateX(0)' }, { transform: 'translateX(100%)' }], { duration: reduce ? 120 : 240, easing: 'cubic-bezier(0.32,0.72,0,1)', fill: 'forwards' });\n    s && s.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, easing: 'ease-out', fill: 'forwards' });\n    const done = () => { this.closing = false; this.setState({ drawer: false }); };\n    a.onfinish = done; a.oncancel = done;\n  }\n\n  setupReveal() {\n    if (!('IntersectionObserver' in window)) return;\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    if (!this.io) {\n      this.io = new IntersectionObserver((entries) => {\n        entries.forEach((e) => {\n          if (!e.isIntersecting) return;\n          const el = e.target;\n          this.io.unobserve(el);\n          const d = (Number(el.getAttribute('data-reveal')) || 0) * 70;\n          el.animate(\n            [{ opacity: 0, transform: 'translateY(20px)' }, { opacity: 1, transform: 'translateY(0)' }],\n            { duration: 640, delay: d, easing: 'cubic-bezier(0.23,1,0.32,1)', fill: 'backwards' }\n          );\n        });\n      }, { rootMargin: '0px 0px -8% 0px' });\n    }\n    document.querySelectorAll('[data-kenburns]:not([data-kb])').forEach((el) => {\n      el.setAttribute('data-kb', '1');\n      const img = el.firstElementChild;\n      img && img.animate([{ transform: 'scale(1.06)' }, { transform: 'scale(1)' }], { duration: 1600, easing: 'cubic-bezier(0.23,1,0.32,1)' });\n    });\n    document.querySelectorAll('[data-reveal]:not([data-rv])').forEach((el) => {\n      el.setAttribute('data-rv', '1');\n      this.io.observe(el);\n    });\n  }\n\n  buildMessage() {\n    const { interest, period, name } = this.state;\n    let m = 'Olá, Dra. Vanessa.';\n    if (name.trim()) m += ` Meu nome é ${name.trim()}.`;\n    m += interest === 'Avaliação inicial' || interest === 'Ainda não sei'\n      ? ' Gostaria de agendar uma avaliação.'\n      : ` Gostaria de agendar uma avaliação sobre ${interest.toLowerCase()}.`;\n    if (period === 'Sábado') m += ' Tenho preferência pelo sábado.';\n    else if (period !== 'Sem preferência') m += ` Tenho preferência pelo período da ${period.toLowerCase()}.`;\n    return m;\n  }\n\n  renderVals() {\n    const { route, w, drawer, interest, period, name } = this.state;\n    const isMobile = w < 900;\n    const phone = '5588999028938';\n    const waMessage = this.buildMessage();\n    const waHref = `https://wa.me/${phone}?text=${encodeURIComponent(waMessage)}`;\n    const addr = 'R. Catulo da Paixão Cearense, 135, Triângulo, Juazeiro do Norte - CE, 63041-162';\n    const mapsHref = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}`;\n    const googleReviewsHref = `https://www.google.com/search?q=${encodeURIComponent('Dra. Vanessa Labres Harmonização Facial Juazeiro do Norte')}`;\n\n    const nav = [\n      { r: 'inicio', label: 'Início', longLabel: 'Início', href: '#/' },\n      { r: 'procedimentos', label: 'Procedimentos', longLabel: 'Procedimentos', href: '#/procedimentos' },\n      { r: 'sobre', label: 'Sobre', longLabel: 'Sobre a Dra. Vanessa', href: '#/sobre' },\n      { r: 'avaliacoes', label: 'Avaliações', longLabel: 'Avaliações', href: '#/avaliacoes' },\n      { r: 'agendamento', label: 'Contato', longLabel: 'Agendamento e contato', href: '#/agendamento' }\n    ];\n    const navItems = nav.map((n) => ({\n      ...n,\n      current: n.r === route ? 'page' : undefined,\n      color: n.r === route ? '#C9A96E' : '#F3EAD9'\n    }));\n\n    const go = (v) => () => this.setState({ interest: v });\n    const procs = [\n      {\n        id: 'toxina', name: 'Toxina botulínica', interest: 'Toxina botulínica',\n        short: 'Atua sobre músculos específicos da expressão, com doses planejadas para cada rosto.',\n        forWhom: 'Quem percebe linhas de expressão na testa ou ao redor dos olhos e quer manter a naturalidade dos movimentos.',\n        how: 'Aplicação com agulhas finas, em pontos definidos na avaliação. A resposta é individual e é acompanhada no retorno.'\n      },\n      {\n        id: 'preenchimento', name: 'Preenchimento com ácido hialurônico', interest: 'Preenchimento',\n        short: 'Trabalha volume e contorno em regiões como lábios, olheiras e mandíbula, respeitando as proporções do rosto.',\n        forWhom: 'Quem busca equilíbrio entre as regiões do rosto, sem exageros.',\n        how: 'O produto é aplicado em pequenas quantidades, conforme o planejamento. Áreas e quantidades variam para cada pessoa.'\n      },\n      {\n        id: 'bio', name: 'Bioestimulador de colágeno', interest: 'Bioestimulador',\n        short: 'Estimula a produção de colágeno pelo próprio organismo, de forma gradual.',\n        forWhom: 'Quem prefere um cuidado gradual com a pele, planejado em etapas e acompanhado de perto.',\n        how: 'Realizado em sessões, com intervalos definidos na avaliação e de acordo com a resposta de cada pele.'\n      }\n    ].map((p, i) => ({ ...p, reveal: String(i + 1), lower: p.interest === 'Preenchimento' ? 'preenchimento' : p.name.toLowerCase(), pick: go(p.interest) }));\n\n    const chip = (list, cur, key) => list.map((label) => ({\n      label,\n      pressed: label === cur ? 'true' : 'false',\n      bg: label === cur ? '#2B2118' : '#F3EAD9',\n      fg: label === cur ? '#F3EAD9' : '#2B2118',\n      onClick: () => this.setState({ [key]: label })\n    }));\n\n    const days = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];\n    const d = new Date().getDay();\n    const todayStatus = d === 0\n      ? 'Hoje é domingo. Agende pelo WhatsApp para a semana.'\n      : d === 6 ? 'Hoje, sábado, atendimento das 9h às 14h.'\n      : `Hoje, ${days[d]}, atendimento das 8h às 18h.`;\n    const hours = [\n      { day: 'Segunda a sexta', time: 'Das 8h às 18h', today: d >= 1 && d <= 5 },\n      { day: 'Sábado', time: 'Das 9h às 14h', today: d === 6 }\n    ].map((h) => ({ ...h, bg: h.today ? '#EADDC6' : 'transparent', weight: h.today ? 500 : 400, day: h.today ? `${h.day} (hoje)` : h.day }));\n\n    const allReviews = [\n      ['Ana P.', 'set 2026', 'Fui muito bem recebida. A Dra. Vanessa explicou cada etapa com calma e respondeu todas as minhas dúvidas.'],\n      ['Juliana M.', 'ago 2026', 'Atendimento atencioso e ambiente acolhedor. Senti segurança desde a primeira conversa.'],\n      ['Carla R.', 'jul 2026', 'Profissional muito cuidadosa. Gostei de ela ouvir o que eu queria antes de indicar qualquer procedimento.'],\n      ['Fernanda S.', 'jun 2026', 'Consultório organizado, horário respeitado e uma explicação clara sobre os cuidados depois do procedimento.'],\n      ['Renata L.', 'mai 2026', 'Me senti à vontade para tirar dúvidas. Atendimento discreto e muito educado.'],\n      ['Patrícia A.', 'abr 2026', 'A avaliação foi detalhada e sem pressa. Recomendo pela atenção e pela honestidade nas orientações.'],\n      ['Luciana B.', 'mar 2026', 'Equipe gentil e agendamento fácil pelo WhatsApp. A doutora acompanhou tudo de perto.'],\n      ['Mariana C.', 'fev 2026', 'Gostei muito da forma como fui orientada. Ela explica o que é indicado e o que não é.'],\n      ['Beatriz F.', 'jan 2026', 'Atendimento pontual e cuidadoso. Voltei para o retorno e fui recebida com a mesma atenção.']\n    ].map(([author, month, text], i) => ({ id: i, author, month, text, reveal: String((i % 3) + 1) }));\n    const pages = {\n      procedimentos: ['Procedimentos', 'Cada indicação parte de uma avaliação individual. Os procedimentos são realizados após conversa e planejamento.'],\n      sobre: ['Dra. Vanessa Labres', 'Especialista e professora em harmonização facial, em Juazeiro do Norte.'],\n      avaliacoes: ['Avaliações', 'Avaliações publicadas por pacientes no perfil do Google.'],\n      agendamento: ['Agendamento e contato', 'O agendamento é feito pelo WhatsApp. Escolha o melhor horário e tire suas dúvidas antes da avaliação.']\n    };\n    const page = pages[route] || ['', ''];\n\n    return {\n      isMobile, isDesktop: !isMobile,\n      drawerOpen: drawer && isMobile,\n      drawerExpanded: drawer ? 'true' : 'false',\n      openDrawer: () => this.setState({ drawer: true }),\n      closeDrawer: () => this.closeDrawerAnimated(),\n      panelRef: this.panelRef, scrimRef: this.scrimRef,\n      drawerKeyDown: (e) => {\n        if (e.key === 'Escape') { this.closeDrawerAnimated(); return; }\n        if (e.key !== 'Tab') return;\n        const f = e.currentTarget.querySelectorAll('a,button');\n        if (!f.length) return;\n        const first = f[0], last = f[f.length - 1];\n        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }\n        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }\n      },\n      skipToMain: (e) => { e.preventDefault(); this.mainRef.current && this.mainRef.current.focus()
